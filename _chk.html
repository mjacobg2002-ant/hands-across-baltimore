<!DOCTYPE html><meta charset="utf-8"><body style="font:13px monospace;white-space:pre-wrap;padding:8px"><div id="out">…</div>
<iframe id="f" src="index.html" style="width:390px;height:700px;border:0;position:absolute;left:-9999px"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>{const d=f.contentDocument,w=f.contentWindow;
  const panel=d.querySelector('.drawer-panel');
  function tx(){const m=getComputedStyle(panel).transform;if(m==='none')return 0;const p=m.match(/matrix\(([^)]+)\)/);return p?Math.round(parseFloat(p[1].split(',')[4])):0;}
  d.getElementById('menu-open').click();
  let tR=[],sR=[],n=0;
  (function tick(){tR.push(tx());sR.push(d.scrollingElement.scrollLeft);if(++n<18){w.requestAnimationFrame(tick);}else{
      document.getElementById('out').textContent='translateX(px): '+tR.join(' ')+'\nscrollLeft values seen: '+[...new Set(sR)].join(',');
  }})();
};
</script></body>
